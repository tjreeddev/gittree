[project]
name = "gittree"
version = "0.1.0"
description = "A read-only, live-updating, interactive Git commit tree for the terminal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2",
]

[project.scripts]
gittree = "gittree.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
